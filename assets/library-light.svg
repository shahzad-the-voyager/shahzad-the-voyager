<svg xmlns="http://www.w3.org/2000/svg" viewBox="105 0 750 272" width="750" height="272" role="img" aria-labelledby="title desc">
  <title id="title">Onboard library: the books that rewrote my firmware</title>
  <desc id="desc">A shelf of book spines drawn as read-only memory modules, numbered 01 to 08: Austin Kleon's Steal Like an Artist, Show Your Work! and Keep Going; Douglas Adams' The Hitchhiker's Guide to the Galaxy, shown as a coral spine reading DON'T PANIC with a towel draped over it; Maxwell Maltz's Psycho-Cybernetics; the Illuminae Files trilogy by Amie Kaufman and Jay Kristoff, Illuminae, Gemina and Obsidio, each with a redaction bar; Harry Potter by J.K. Rowling; Algorithms to Live By by Brian Christian and Tom Griffiths; Thinking, Fast and Slow by Daniel Kahneman; and Before the Coffee Gets Cold by Toshikazu Kawaguchi. Slots 09 and 10 are empty.</desc>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .mod { animation: in .45s ease-out backwards; }
    .late { animation: in 1s ease-out 1.8s backwards; }
    .blink { animation: blink 1.6s steps(1) 2.4s infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } }
    @keyframes blink { 50% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { .mod, .late, .blink { animation: none; } }
  </style>
