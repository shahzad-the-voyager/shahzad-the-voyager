<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 78" width="960" height="78" role="img" aria-labelledby="title desc">
  <title id="title">Live telemetry, updated 2026-11-22</title>
  <desc id="desc">Voyager 1 is 25.908 billion km from Earth, light-time 24 hours 0 minutes, per NASA JPL Horizons on 2026-11-22. This probe: 5 years 3 months in production. T−12 DAYS TO THE BACKYARD ULTRA · ISLAMABAD · GOAL 10 LOOPS.</desc>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .live { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="959" height="77" rx="6" fill="none" stroke="#30363d"/>
  <circle class="live" cx="22" cy="20" r="3.4" fill="#58a6ff"/>
  <text x="34" y="24" class="t" font-size="11" letter-spacing="2" fill="#58a6ff">VOYAGER 1</text>
  <text x="146" y="24" class="t" font-size="11" letter-spacing="1.2" fill="#8b949e"><tspan fill="#e6edf3" font-weight="700">25.908 BILLION KM</tspan> FROM EARTH · LIGHT-TIME 24 H 00 M · RECEDING 24.0 KM/S<tspan fill="#58a6ff">  ▲ PAST ONE LIGHT-DAY</tspan></text>
  <circle class="live" cx="22" cy="50" r="3.4" fill="#ff7b72" style="animation-delay:.8s"/>
  <text x="34" y="54" class="t" font-size="11" letter-spacing="2" fill="#ff7b72">THIS PROBE</text>
  <text x="146" y="54" class="t" font-size="11" letter-spacing="1.2" fill="#8b949e"><tspan fill="#e6edf3" font-weight="700">5 YR 3 MO</tspan> IN PRODUCTION · <tspan fill="#ff7b72">T−12 DAYS TO THE BACKYARD ULTRA · ISLAMABAD · GOAL 10 LOOPS</tspan></text>
  <text x="944" y="70" text-anchor="end" class="t" font-size="8.5" letter-spacing="1.5" fill="#6e7681">UPDATED 2026-11-22 · NASA JPL HORIZONS</text>
</svg>
