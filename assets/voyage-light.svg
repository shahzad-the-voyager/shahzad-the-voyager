<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 246" width="960" height="246" role="img" aria-labelledby="title desc">
  <title id="title">Ship's log: ports of call</title>
  <desc id="desc">A route on a nautical chart through five ports, in order of departure: ML internship (2021.04), AntonX (2021.08), Tripmate (2024.01), Utor (2024.07) and CCRIPT (2026), marked as the current position. Beyond it, a faint dashed course continues into uncharted waters labelled medicine.</desc>
  <defs>
    <linearGradient id="career" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="730" y2="0">
      <stop offset="0.000" stop-color="#8250df"/>
      <stop offset="0.250" stop-color="#0969da"/>
      <stop offset="0.500" stop-color="#1a7f37"/>
      <stop offset="0.750" stop-color="#bc4c00"/>
      <stop offset="1.000" stop-color="#cf222e"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .route { fill: none; stroke: url(#career); stroke-width: 3; stroke-linecap: round;
      stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 3.2s linear 0.4s backwards; }
    .wake { fill: none; stroke: url(#career); stroke-width: 9; stroke-linecap: round; opacity: .12; }
    .ext { fill: none; stroke: #818b98; stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; }
    .port { animation: pop .5s cubic-bezier(.3,1.6,.5,1) backwards; transform-box: fill-box; transform-origin: center; }
    .late { animation: fade 1s ease-out 3.60s backwards; }
    .ping { fill: none; stroke: #cf222e; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: ping 2.5s ease-out 3.60s infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes ping { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.4); } }
    @media (prefers-reduced-motion: reduce) {
      .route, .port, .late { animation: none; }
      .ping { animation: none; display: none; }
    }
  </style>
  <g><line x1="20" y1="52" x2="20" y2="236" stroke="#e6eaef" stroke-width="1"/><line x1="60" y1="52" x2="60" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="100" y1="52" x2="100" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="140" y1="52" x2="140" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="180" y1="52" x2="180" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="220" y1="52" x2="220" y2="236" stroke="#e6eaef" stroke-width="1"/><line x1="260" y1="52" x2="260" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="300" y1="52" x2="300" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="340" y1="52" x2="340" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="380" y1="52" x2="380" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="420" y1="52" x2="420" y2="236" stroke="#e6eaef" stroke-width="1"/><line x1="460" y1="52" x2="460" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="500" y1="52" x2="500" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="540" y1="52" x2="540" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="580" y1="52" x2="580" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="620" y1="52" x2="620" y2="236" stroke="#e6eaef" stroke-width="1"/><line x1="660" y1="52" x2="660" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="700" y1="52" x2="700" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="740" y1="52" x2="740" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="780" y1="52" x2="780" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="820" y1="52" x2="820" y2="236" stroke="#e6eaef" stroke-width="1"/><line x1="860" y1="52" x2="860" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="900" y1="52" x2="900" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="940" y1="52" x2="940" y2="236" stroke="#f3f5f7" stroke-width="1"/><line x1="20" y1="62" x2="940" y2="62" stroke="#f3f5f7" stroke-width="1"/><line x1="20" y1="102" x2="940" y2="102" stroke="#f3f5f7" stroke-width="1"/><line x1="20" y1="142" x2="940" y2="142" stroke="#f3f5f7" stroke-width="1"/><line x1="20" y1="182" x2="940" y2="182" stroke="#f3f5f7" stroke-width="1"/><line x1="20" y1="222" x2="940" y2="222" stroke="#f3f5f7" stroke-width="1"/></g>
  <text x="20" y="34" class="t" font-size="12" letter-spacing="3" fill="#59636e">SHIP'S LOG // PORTS OF CALL</text>
  <text x="940" y="34" text-anchor="end" class="t" font-size="12" letter-spacing="2" fill="#59636e">BEARING 045° · ENGINEERING × MEDICINE</text>
  <path class="wake" d="M 70 150 C 97.5 143.7 180.0 110.7 235 112 C 290.0 113.3 345.0 157.3 400 158 C 455.0 158.7 510.0 119.0 565 116 C 620.0 113.0 702.5 136.0 730 140"/>
  <path class="route" pathLength="1" d="M 70 150 C 97.5 143.7 180.0 110.7 235 112 C 290.0 113.3 345.0 157.3 400 158 C 455.0 158.7 510.0 119.0 565 116 C 620.0 113.0 702.5 136.0 730 140"/>
  <g class="late">
    <path class="ext" d="M 730 140 C 741.7 136.3 776.7 120.0 800 118 C 823.3 116.0 851.3 129.3 870 128 C 888.7 126.7 905.0 113.0 912 110"/>
    <path d="M 903 108 L 914 104 L 907 115 Z" fill="#818b98"/>
    <text x="920" y="84" text-anchor="end" class="t" font-size="11" letter-spacing="2" fill="#818b98">UNCHARTED</text>
    <text x="920" y="98" text-anchor="end" class="t" font-size="12" font-style="italic" fill="#59636e">medicine</text>
    <text x="730" y="216" text-anchor="middle" class="t" font-size="11" letter-spacing="2" fill="#cf222e">▲ YOU ARE HERE</text>
  </g>
  <circle class="ping" cx="730" cy="140" r="8"/>
  <g class="port" style="animation-delay:0.40s">
    <line x1="70" y1="138" x2="70" y2="120" stroke="#818b98" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="70" y="112" text-anchor="middle" class="t" font-size="12" letter-spacing="1.5" fill="#59636e">2021.04</text>
    <circle cx="70" cy="150" r="7" fill="#ffffff" stroke="#8250df" stroke-width="2.5"/><circle cx="70" cy="150" r="2.5" fill="#8250df"/>
    <text x="70" y="184" text-anchor="middle" class="t" font-size="15" font-weight="700" letter-spacing="1" fill="#8250df">ML internship</text>
    <text x="70" y="204" text-anchor="middle" class="t" font-size="12" fill="#59636e">first contact</text>
  </g><g class="port" style="animation-delay:1.20s">
    <line x1="235" y1="100" x2="235" y2="82" stroke="#818b98" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="235" y="74" text-anchor="middle" class="t" font-size="12" letter-spacing="1.5" fill="#59636e">2021.08</text>
    <circle cx="235" cy="112" r="7" fill="#ffffff" stroke="#0969da" stroke-width="2.5"/><circle cx="235" cy="112" r="2.5" fill="#0969da"/>
    <text x="235" y="146" text-anchor="middle" class="t" font-size="15" font-weight="700" letter-spacing="1" fill="#0969da">AntonX</text>
    <text x="235" y="166" text-anchor="middle" class="t" font-size="12" fill="#59636e">into production</text>
  </g><g class="port" style="animation-delay:2.00s">
    <line x1="400" y1="146" x2="400" y2="128" stroke="#818b98" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="400" y="120" text-anchor="middle" class="t" font-size="12" letter-spacing="1.5" fill="#59636e">2024.01</text>
    <circle cx="400" cy="158" r="7" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/><circle cx="400" cy="158" r="2.5" fill="#1a7f37"/>
    <text x="400" y="192" text-anchor="middle" class="t" font-size="15" font-weight="700" letter-spacing="1" fill="#1a7f37">Tripmate</text>
    <text x="400" y="212" text-anchor="middle" class="t" font-size="12" fill="#59636e">maps &amp; motion</text>
  </g><g class="port" style="animation-delay:2.80s">
    <line x1="565" y1="104" x2="565" y2="86" stroke="#818b98" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="565" y="78" text-anchor="middle" class="t" font-size="12" letter-spacing="1.5" fill="#59636e">2024.07</text>
    <circle cx="565" cy="116" r="7" fill="#ffffff" stroke="#bc4c00" stroke-width="2.5"/><circle cx="565" cy="116" r="2.5" fill="#bc4c00"/>
    <text x="565" y="150" text-anchor="middle" class="t" font-size="15" font-weight="700" letter-spacing="1" fill="#bc4c00">Utor</text>
    <text x="565" y="170" text-anchor="middle" class="t" font-size="12" fill="#59636e">the pocket</text>
  </g><g class="port" style="animation-delay:3.60s">
    <line x1="730" y1="128" x2="730" y2="110" stroke="#818b98" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="730" y="102" text-anchor="middle" class="t" font-size="12" letter-spacing="1.5" fill="#59636e">2026</text>
    <circle cx="730" cy="140" r="7.5" fill="#cf222e"/>
    <text x="730" y="174" text-anchor="middle" class="t" font-size="15" font-weight="700" letter-spacing="1" fill="#cf222e">CCRIPT</text>
    <text x="730" y="194" text-anchor="middle" class="t" font-size="12" fill="#59636e">fintech · document AI</text>
  </g>
</svg>
