<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 414" width="960" height="414" role="img" aria-labelledby="title desc">
  <title id="title">The Golden Record, SA-2021 pressing: now playing B5</title>
  <desc id="desc">A record on a turntable, Side B. The centre label, engraved with SA-2021 and the bits 0101 0011 0100 0001, turns at 16 and two-thirds revolutions per minute, the speed of the Voyager golden record. The groove for track B5 is highlighted and the stylus sits in it. Now playing: B5, footsteps on a 6.706 km loop, every hour, on the hour. Backyard ultra, Islamabad, December 2026. Twenty-four hour boxes, the first one lit, with a flag on box ten: the goal is ten loops, 67 km in ten hours.</desc>
  <defs>
    <path id="lbl" d="M 198 230 a 38 38 0 1 1 76 0 a 38 38 0 1 1 -76 0"/>
    <path id="run" d="M 179 230 a 57 57 0 1 1 114 0 a 57 57 0 1 1 -114 0"/>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .spin { transform-box: view-box; transform-origin: 236px 230px; animation: spin 3.60s linear infinite; }
    .fade { animation: fade .8s ease-out backwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
    .hour { animation: hour 2s ease-in-out 1.6s infinite; }
    .needle { animation: hour 1.2s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes hour { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .spin, .fade, .hour, .needle { animation: none; } }
  </style>
