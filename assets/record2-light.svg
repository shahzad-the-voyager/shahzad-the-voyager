    <text x="470" y="282" class="t" font-size="12" fill="#59636e">One loop an hour. Miss a start and you are out.</text>
    <text x="470" y="302" class="t" font-size="12" fill="#59636e">No finish line. My target: ten loops, ten hours.</text>
  </g>
