<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Shahzad Ahmad · Engineer · Voyager · Medicine in pursuit</title>
  <desc id="desc">A single signal trace. On the left, the ASCII bits of the letters S and A drawn as a digital waveform. On the right, the same line becomes an ECG rhythm strip at 72 beats per minute, the rate set by the heart's sinoatrial (SA) node.</desc>
  <defs>
    <linearGradient id="trace" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="920" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.40" stop-color="#58a6ff"/>
      <stop offset="0.52" stop-color="#ff7b72"/>
      <stop offset="1" stop-color="#ff7b72"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .trace { fill: none; stroke: url(#trace); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;
      stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.6s cubic-bezier(.6,.05,.3,1) .3s backwards; }
    .sweep { fill: none; stroke: #ffa198; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: .05 1.2; stroke-dashoffset: .05; opacity: .9;
      animation: sweep 2.5s linear 2.9s infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .fade { animation: fade .8s ease-out backwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: 2.4s; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes sweep { from { stroke-dashoffset: .05; } to { stroke-dashoffset: -1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; }
      .sweep, .cursor { animation: none; display: none; }
      .fade { animation: none; }
    }
  </style>
