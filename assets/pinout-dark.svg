<svg xmlns="http://www.w3.org/2000/svg" viewBox="175 0 640 372" width="640" height="372" role="img" aria-labelledby="title desc">
  <title id="title">SA-2021 pinout: Shahzad Ahmad's engineering stack</title>
  <desc id="desc">A 24-pin chip datasheet, top view. Languages: Go, Python, C++, TypeScript. Data: PostgreSQL, SQL, Redis, Kafka. Systems: REST, gRPC, Node.js, FastAPI, concurrency, distributed systems, system design. Mobile and web: Flutter, Dart, Swift, iOS, React, Next.js. Cloud and delivery: AWS, Google Cloud, Cloud Run, Docker, Kubernetes, GitHub Actions, ELK. Machine intelligence: LLMs, RAG, OCR, intelligent document processing, CNNs, reinforcement learning. Pin 12, ground, is first principles. Pin 24, power, is curiosity.</desc>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .s { animation: in .5s ease-out backwards; }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat .833s ease-out 1.5s infinite; }
    @keyframes in { from { opacity: 0; } }
    @keyframes beat { 0% { transform: scale(1); opacity: 1; } 14% { transform: scale(1.9); opacity: .9; } 40%, 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .s, .beat { animation: none; } }
  </style>
