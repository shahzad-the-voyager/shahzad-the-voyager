name: telemetry

on:
  schedule:
    - cron: "5 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voyager 1 telemetry
        run: python scripts/telemetry.py
      - name: Training log
        run: python scripts/training.py
      - name: Constellation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/constellation.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry-*.svg assets/constellation-*.svg assets/training-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "telemetry: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
