name: greetings

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  record:
    if: startsWith(github.event.issue.title, '[greeting]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: greet
        run: python scripts/greetings.py
      - name: Commit
        if: steps.greet.outputs.accepted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/greetings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "greeting: #${ISSUE}"
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          ISSUE: ${{ github.event.issue.number }}
      - name: Reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ACCEPTED: ${{ steps.greet.outputs.accepted }}
          REASON: ${{ steps.greet.outputs.reason }}
        run: |
          if [ "$ACCEPTED" = "true" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Received loud and clear. Your greeting is now on the record. Thank you."
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          elif [ "$REASON" = "links" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Signal received, but links and mentions can't go on the record. Feel free to open a new greeting without them."
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Signal received, but it arrived empty. Please use the greeting form and fill in both fields."
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
